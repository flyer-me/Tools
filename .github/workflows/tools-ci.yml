name: tools-ci

on:
  pull_request:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tools-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifests and scripts
        shell: pwsh
        run: .\scripts\validate-tools.ps1

      - name: Upload tool index
        uses: actions/upload-artifact@v4
        with:
          name: tool-index
          path: out/tool-index.json
          if-no-files-found: error

  build:
    needs: validate
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        shell: pwsh
        run: python -m pip install --upgrade pyinstaller

      - name: Build tools
        shell: pwsh
        run: .\scripts\build-tool.ps1

      - name: Assert declared artifacts exist
        shell: pwsh
        run: .\scripts\assert-artifacts.ps1

      - name: Package tools
        shell: pwsh
        run: .\scripts\package-tool.ps1 -Version "0.0.0-ci.${{ github.run_number }}"

      - name: Upload tool packages
        uses: actions/upload-artifact@v4
        with:
          name: tool-packages
          path: out/packages/*
          if-no-files-found: error
