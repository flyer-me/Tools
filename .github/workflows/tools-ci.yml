name: tools-ci

on:
  pull_request:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tools-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifests and scripts
        shell: pwsh
        run: .\scripts\validate-tools.ps1

      - name: Upload tool index
        uses: actions/upload-artifact@v4
        with:
          name: tool-index
          path: out/tool-index.json
          if-no-files-found: error

  build:
    needs: validate
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          cache: true

      - name: Publish dotnet-msbuild tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $manifests = Get-ChildItem -Path tools -Recurse -File -Filter "tool.manifest.json"
          foreach ($manifest in $manifests) {
            $tool = Get-Content $manifest.FullName -Raw | ConvertFrom-Json
            if ($tool.build.kind -ne "dotnet-msbuild") { continue }

            $toolDir = Split-Path -Parent $manifest.FullName
            $project = [string]$tool.build.project
            $configuration = if ($tool.build.configuration) { [string]$tool.build.configuration } else { "Release" }
            $args = @()
            if ($tool.build.args) {
              foreach ($arg in $tool.build.args) { $args += [string]$arg }
            }

            Push-Location $toolDir
            try {
              # 发布属性（RID / 单文件 / 压缩）固化在各项目的 csproj 里，
              # 这里只传 configuration 与 manifest 声明的额外参数。
              dotnet publish $project -c $configuration @args
              if ($LASTEXITCODE -ne 0) { throw "publish failed for $($tool.toolId)" }
            }
            finally {
              Pop-Location
            }
          }

      - name: Assert declared artifacts exist
        shell: pwsh
        run: .\scripts\assert-artifacts.ps1

      - name: Package tools
        shell: pwsh
        run: .\scripts\package-tool.ps1 -Version "0.0.0-ci.${{ github.run_number }}"

      - name: Upload tool packages
        uses: actions/upload-artifact@v4
        with:
          name: tool-packages
          path: out/packages/*
          if-no-files-found: error
